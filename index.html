<title>Stock Count</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#111;--mute:#6b6b6b;--brand:#d92d20;--tint:#fdeceb;--line:#dcdcdc;--on:#fff;--tile:#f3f3f3;--dg:#111;--dgb:#fff;--dgl:#cfcfcf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#161616;--ink:#f2f2f2;--mute:#9a9a9a;--brand:#ff4d3d;--tint:#2a1614;--line:#2c2c2c;--on:#fff;--tile:#1d1d1d;--dg:#f2f2f2;--dgb:#161616;--dgl:#3a3a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--card:#161616;--ink:#f2f2f2;--mute:#9a9a9a;--brand:#ff4d3d;--tint:#2a1614;--line:#2c2c2c;--on:#fff;--tile:#1d1d1d;--dg:#f2f2f2;--dgb:#161616;--dgl:#3a3a3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#000;color:#fff;border-bottom:3px solid var(--brand);display:flex;align-items:center;gap:12px;padding:12px 18px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--on);display:grid;place-items:center;font-size:20px}
header b{font-size:21px;letter-spacing:-.5px;flex:1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ico{font-size:22px;color:var(--brand);padding:6px 10px}
main{padding:18px;max-width:640px;margin:0 auto}
h1{font-size:34px;letter-spacing:-1px;margin:4px 0 8px}
h2{color:var(--brand);font-size:23px;margin:26px 0 12px}
.eye{color:var(--brand);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.mute{color:var(--mute)}
.back{color:var(--mute);font-weight:600;padding:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px}
.home{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font-size:20px;font-weight:650;border-radius:28px;padding:20px}
.home .b{width:58px;height:58px;border-radius:18px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-size:26px}
.home .arr{margin-left:auto;color:var(--mute)}
.num{background:var(--tint);color:var(--brand);font-weight:700;border-radius:10px;padding:4px 10px;font-size:15px}
.rh{display:flex;align-items:center;gap:14px;font-size:19px;font-weight:650;margin-bottom:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
.row3 label{font-size:13px;color:var(--mute);font-weight:600;display:block;margin-bottom:6px;white-space:nowrap}
.fld{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;height:50px;padding:0 5px 0 4px}
.fld input{border:0;background:none;width:100%;min-width:0;padding:0 6px;font-size:17px;color:var(--ink);outline:0;-webkit-touch-callout:none}
.plus{flex:none;width:32px;height:32px;border-radius:10px;background:var(--tint);color:var(--brand);font-size:20px;line-height:1}
.fn{font-size:11px;color:var(--mute);margin-top:4px}
input[type=text],input[type=date],select{width:100%;font-size:17px;padding:13px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 14px}
.banner{background:var(--tint);border-radius:18px;padding:16px;margin:14px 0}
.banner button{color:var(--brand);font-weight:700;padding:0}
.pri{background:var(--brand);color:var(--on);font-weight:700;border-radius:20px;height:54px;width:100%}
.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:20px;height:54px;padding:0 24px;font-weight:650}
.bar{display:flex;gap:12px;margin:22px -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:8}
.list .it{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
.list .it:last-child{border-bottom:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.mono{font-family:ui-monospace,Menlo,monospace;color:var(--mute);font-size:14px}
.chk{margin-left:auto;color:var(--brand);font-size:20px}
.off{opacity:.45}
.empty{border:1.5px dashed var(--line);border-radius:28px;padding:34px 20px;text-align:center}
.empty .b{width:86px;height:86px;border-radius:26px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-size:38px;margin:0 auto 14px}
.empty h3{font-size:24px;margin:0 0 6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:20px}
.dlg{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:340px}
.dlg h3{margin:0 0 6px}
.dlg .btns{display:flex;gap:10px}.dlg .btns button{height:46px;flex:1;border-radius:14px}
.dlg .pri{width:auto}
.sec{display:flex;justify-content:space-between;align-items:baseline}
details{margin-top:18px;color:var(--mute)}summary{cursor:pointer;font-size:17px}
.dr{padding:18px;border-bottom:1px solid var(--line)}.dr:last-child{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--tile);border-radius:18px;padding:14px 12px}
.tile span{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tile b{display:block;font-size:28px;font-weight:600;margin-top:8px;letter-spacing:-.5px}
.acts{display:flex;gap:12px;margin:16px 0 4px}.acts .pri{flex:1}
.del{background:var(--dgb);color:var(--dg);border:1.5px solid var(--dgl);border-radius:20px;height:54px;padding:0 26px;font-weight:700}
.calc{font-size:13px;font-weight:700;color:var(--brand);margin-top:4px}
.hero{background:#000;color:#fff;border-radius:28px;padding:24px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid #2a2a2a}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:var(--brand)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;margin:6px 0 18px}
.hero p{color:#bdbdbd;margin:0 0 18px}
.hero .pri{height:56px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.stat b{display:block;font-size:26px;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.home small{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:2px}
.grip{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;color:var(--mute);font-size:22px;line-height:1;padding:8px 6px 8px 0}
.list .it{transition:transform .15s}
.list .it.mr{display:block}
.mr .line{display:flex;align-items:center;gap:14px}
.flds{padding:12px 0 0 34px}
.fe{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fe .chip{flex:none;min-width:64px}
.fe input.fl{margin:0;padding:10px 12px;font-size:16px;border-radius:14px;flex:1;min-width:0}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--tint);border-color:var(--brand);color:var(--brand)}
.lh{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:6px;min-width:0}
.lh label{margin:0;overflow:hidden;text-overflow:ellipsis}
.tl{flex:none;width:26px;height:22px;border-radius:8px;background:var(--tint);color:var(--brand);font-weight:700;font-size:15px;line-height:1}
.tl.on{background:var(--brand);color:var(--on)}
.list .it.drag{transition:none;position:relative;z-index:5;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.3);border-radius:14px}
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tab{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;font-weight:700;font-size:14px;line-height:1.25}
.tab small{display:block;font-weight:600;color:var(--mute);font-size:12px;margin-top:2px}

/* ===== motion ===== */

#orb{position:fixed;z-index:47;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;display:none;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;--og:#e6c46c;background:radial-gradient(circle at 35% 30%,#4a4a4a 0,#111 55%,#000 100%);box-shadow:0 0 0 1.5px #1f1d1a,0 0 18px 2px color-mix(in srgb,var(--og) 55%,transparent),0 8px 20px rgba(0,0,0,.3);animation:orbB 2.6s ease-in-out infinite;transition:opacity .2s}
:root:not(.stk) #orb{--og:var(--brand)}
.v-enter #orb{display:block}
body:has(#lockscr:not(.out)) #orb{display:none!important}
#orb svg{position:absolute;inset:0;width:100%;height:100%}
#orb .core{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--og);box-shadow:0 0 12px 3px var(--og)}
#orb.drag{cursor:grabbing;animation:none;transition:none}
#orb.back{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes orbB{0%,100%{box-shadow:0 0 0 1.5px #1f1d1a,0 0 14px 1px color-mix(in srgb,var(--og) 45%,transparent),0 8px 20px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 1.5px #1f1d1a,0 0 28px 7px color-mix(in srgb,var(--og) 70%,transparent),0 8px 20px rgba(0,0,0,.3)}}
#orbbg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#orbbg.on{opacity:1;pointer-events:auto}
.otg{position:fixed;z-index:46;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:600;line-height:1;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .2s;border:1.5px solid #1f1d1a;box-shadow:3px 3px 0 #1f1d1a}
.otg span{position:absolute;top:100%;margin-top:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#fff;font-weight:600;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.otg.on{opacity:1;transform:scale(1);pointer-events:auto}
.otg.on.hot{transform:scale(1.22);box-shadow:0 0 0 8px rgba(255,255,255,.35),3px 3px 0 #1f1d1a}
#otS{background:#e6c46c;color:#1f1d1a}#otC{background:#fff;color:#1f1d1a}
:root:not(.stk) #otS{background:var(--brand);color:#fff;border-color:transparent;box-shadow:0 10px 30px rgba(0,0,0,.35)}
:root:not(.stk) #otC{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.orip{position:fixed;z-index:48;border-radius:50%;pointer-events:none}
</style>

<body>
<header><svg class="lgsvg pre" viewBox="2 3 44 42" width="40" height="38" role="img" aria-label="StockCount logo" fill="none" stroke="currentColor" style="color:var(--brand)" stroke-linecap="round" stroke-linejoin="round"><g stroke-width="1.5" class="body"><path pathLength="1" d="M15 9 V18 Q15 24 24 24 Q33 24 33 18 V9"/><path pathLength="1" d="M15 39 V30 Q15 24 24 24 Q33 24 33 30 V39"/></g><g stroke-width="1"><path class="leg" pathLength="1" style="--i:0;transform-origin:100% 100%" d="M15 9 L10 5 L5 9"/><path class="leg" pathLength="1" style="--i:1;transform-origin:100% 27%" d="M15 16 L8 14.5 L4 20"/><path class="leg" pathLength="1" style="--i:2;transform-origin:100% 0%" d="M15 39 L10 43 L5 39"/><path class="leg" pathLength="1" style="--i:3;transform-origin:100% 73%" d="M15 32 L8 33.5 L4 28"/><path class="leg" pathLength="1" style="--i:4;transform-origin:0% 100%" d="M33 9 L38 5 L43 9"/><path class="leg" pathLength="1" style="--i:5;transform-origin:0% 27%" d="M33 16 L40 14.5 L44 20"/><path class="leg" pathLength="1" style="--i:6;transform-origin:0% 0%" d="M33 39 L38 43 L43 39"/><path class="leg" pathLength="1" style="--i:7;transform-origin:0% 73%" d="M33 32 L40 33.5 L44 28"/></g></svg><b>StockCount</b><button class="ico" data-go="home" aria-label="Home">⌂</button></header>
<div id="aurora" aria-hidden="true"><i class="ab ab1"></i><i class="ab ab2"></i><i class="ab ab3"></i></div>
<main id="app"></main>
<script>
const SECTIONS=["Stock room","Chiller","Freezer"];
const PG=[...SECTIONS,"Buns"],pgOf=r=>/^buns\b/i.test(r.name)?"Buns":r.section;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const v=parseFloat(String(s).replace("~","").replace(",","."));return isNaN(v)?null:v};
const apx=s=>String(s).trim().startsWith("~");
const AP=(e,k)=>e.ap&&e.ap.includes(k)?"~":"";
const fmt=v=>v==null?"–":String(Math.round(v*100)/100);
const fmtN=v=>v==null?"–":v.toLocaleString("en-US",{maximumFractionDigits:2});
const has=(r,k)=>!(r.off||[]).includes(k);
const DL={b:"Boxes",i:"Inners",n:"Individuals"};
const L=(r,k)=>(r.lbl&&r.lbl[k])||DL[k];
const EL=(e,k)=>(e.lbl&&e.lbl[k])||DL[k];
const eOff=e=>e.off||((e.noInner||(e.mult!==1&&e.inners==null))?["i"]:[]);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const nice=s=>new Date(s+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
function defaults(){
  const mk=(s,a)=>a.map(n=>({id:uid(),name:n,section:s,active:true,mult:1}));
  const r=mk("Stock room",["Coffee Beans","HM - Toys","HM - Book"]);r[1].mult=150;r[2].mult=150;r[1].off=r[2].off=["i"];
  return r.concat(mk("Chiller",["LETTUCE-SHREDDED","SUNDAE MIX","SHAKE MIX"]),
   mk("Freezer",["MAC+CHEESE BITES","CHICKEN-SELECT","BUNS-BIG ARCH","BUNS-BIG MAC BB","BUNS-QUARTER BB","BUNS-REGULAR","4:1 QTR MEAT","REGULAR 10:1 MEAT","CHICKEN-NUGGETS","FRIES"]));
}
function load(k,fb){try{const v=JSON.parse(localStorage.getItem(k));if(Array.isArray(v))return v}catch(e){}return fb}
function save(){try{if(typeof syTouch==="function")syTouch()}catch(e){}try{localStorage.setItem("sc.rows",JSON.stringify(rows));localStorage.setItem("sc.sessions",JSON.stringify(sessions))}catch(e){}}
let rows=load("sc.rows",null)||defaults(), sessions=load("sc.sessions",[]);
rows.forEach(r=>{if(r.name==="HM - Book"&&r.mult===1)r.mult=150;if(!r.off){r.off=(r.noInner||r.name==="HM - Toys"||r.name==="HM - Book"||r.name==="BUNS-BIG MAC BB")?["i"]:[]}});
rows.forEach(r=>{if(/^buns\b/i.test(r.name)){r.lbl=r.lbl||{};const d={b:"Trays",i:"Sleeves",n:"Individual"};for(const k in d)if(!r.lbl[k])r.lbl[k]=d[k]}});
save();
let view="home",arg=null,drafts={},draftDate=today(),mSection=SECTIONS[0],editId=null,openRow=null;
let secTab=SECTIONS[0],qry="",done={},mq="",lastHide=0;
const hasDraft=()=>Object.values(drafts).some(d=>d&&(d.b||d.i||d.n))||Object.values(done).some(Boolean);
function loadDraft(){try{const d=JSON.parse(localStorage.getItem("sc.draft"));if(d&&typeof d==="object"){drafts=d.drafts||{};draftDate=d.date||today();done=d.done||{};secTab=PG.includes(d.tab)?d.tab:SECTIONS[0];editId=d.editId&&sessions.some(x=>x.id===d.editId)?d.editId:null}}catch(e){}}
function saveDraft(){try{if(!hasDraft()&&!editId){localStorage.removeItem("sc.draft");return}localStorage.setItem("sc.draft",JSON.stringify({drafts,date:draftDate,done,tab:secTab,editId}))}catch(e){}}
function clearDraft(){drafts={};done={};draftDate=today();editId=null;secTab=SECTIONS[0];qry="";try{localStorage.removeItem("sc.draft")}catch(e){}}
loadDraft();
function homeHero(){const last=sessions.map(s=>s.date).sort().pop();const ld=last?new Date(last+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}):"–";
return `<div class="hero holo"><div class="eye">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div><h1>Ready to count?</h1><button class="pri" data-go="enter">${hasDraft()||editId?"Continue count":"+ Start new count"}</button>${hasDraft()&&!editId?`<button class="dsc" data-act="discard">Discard unsaved count</button>`:""}</div>`}
const calcText=(r,v)=>{const x=num(v||"");return x==null?"Each box = "+r.mult+" units":"= "+(apx(v||"")?"~":"")+fmtN(x*r.mult)+" units"};
function trailAdd(i,b,v){const r=i.dataset.r,k=i.dataset.k;if(!r||!k)return;const dr=drafts[r]=drafts[r]||{},tr=dr.t=dr.t||{};let a=tr[k]||[];
  const sum=a.reduce((x,y)=>x+y,0);if(!a.length||Math.abs(sum-b)>1e-9)a=b?[b]:[];tr[k]=a.concat(v)}
function trailText(a,e,k){const t=a.map((x,idx)=>idx?(x<0?"− "+fmtN(-x):"+ "+fmtN(x)):fmtN(x)).join(" "),tot=a.reduce((x,y)=>x+y,0);
  return t+" = "+AP(e,k)+fmtN(tot)+(k==="b"&&e.mult!==1?" (×"+e.mult+" = "+fmtN(tot*e.mult)+")":"")}
function trailBox(e){const rows=["b","i","n"].filter(k=>e.tr[k]).map(k=>`<div class="trl"><span>${esc(EL(e,k))}</span><b>${trailText(e.tr[k],e,k)}</b></div>`).join("");
  return `<div class="trbox"><div class="trin"><div class="trhd">What you added</div>${rows}</div></div>`}
function trailOut(d,r){const o={},val={b:num(d.b||""),i:num(d.i||""),n:num(d.n||"")};
  for(const k of ["b","i","n"]){const a=d.t&&d.t[k];if(!a||a.length<2||!has(r,k)||val[k]==null)continue;if(Math.abs(a.reduce((x,y)=>x+y,0)-val[k])>1e-9)continue;o[k]=a.slice()}
  return Object.keys(o).length?o:undefined}
function commitAdd(i){const v=num(i.value),b=+i.dataset.base;if(v!=null)trailAdd(i,b,v);i.value=v==null?i.dataset.orig:(apx(i.dataset.orig)?"~":"")+fmt(b+v);i.placeholder="";delete i.dataset.base;delete i.dataset.orig;i.dispatchEvent(new Event("input",{bubbles:true}))}
const active=()=>SECTIONS.flatMap(s=>rows.filter(r=>r.section===s&&r.active));
const app=document.getElementById("app");

function modal(title,{input=false,ok="OK",msg="",no="Cancel"}={}){return new Promise(res=>{
  const d=document.createElement("div");d.className="ov";
  d.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3>${msg?`<p class="mute">${esc(msg)}</p>`:""}${input?'<input type="text" inputmode="decimal" placeholder="Amount found">':""}<div class="btns"><button class="ghost" data-x="0">${esc(no)}</button><button class="pri" data-x="1">${esc(ok)}</button></div></div>`;
  document.body.appendChild(d);const i=d.querySelector("input");if(i)i.focus();
  d.onclick=e=>{const x=e.target.dataset.x;if(x===undefined&&e.target!==d)return;d.remove();res(x==="1"?(i?i.value:true):null)};
})}

function go(v,a){const prev=view;if(v==="home"&&editId)clearDraft();view=v;arg=a||null;qry="";mq="";render();window.scrollTo(0,0);if(v==="home"&&MORPH_VIEWS.includes(prev)&&motionOn())morphClose(prev)}

function render(){
  let h="";document.documentElement.classList.toggle("v-enter",view==="enter");if(view==="enter"){fitVV();requestAnimationFrame(()=>fitRows());setTimeout(fitRows,120);setTimeout(fitRows,450);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view==="enter")fitRows()});watchFit()}
  if(view==="home"){
    h=`${homeHero()}<div style="display:grid;gap:14px">
    
    <button class="card home holo" data-go="history"><span class="b">${svg("check",24)}</span><span>Previous Counts<small>${sessions.length} saved</small></span><span class="arr">→</span></button>
    <button class="card home holo" data-go="manage"><span class="b">${svg("list",24)}</span><span>Manage Rows<small>${rows.filter(r=>r.active).length} of ${rows.length} rows active</small></span><span class="arr">→</span></button>
    <button class="card home holo" data-go="settings"><span class="b">${svg("sliders",24)}</span><span>Settings<small>Face ID lock, colour &amp; font</small></span><span class="arr">→</span></button></div>`;
  }else if(view==="enter"){
    h=editId?`<button class="back" data-act="leave">← Back</button><div class="eye">Editing session</div><h1>Edit counts</h1>
    <label class="mute" style="font-weight:600">Count date</label><input type="date" id="dt" value="${draftDate}">`:``;
    h+=`
    <div class="tabs" id="tabs"></div>
    <input type="text" id="q" class="srch" placeholder="Search rows…" value="${esc(qry)}" autocomplete="off" autocapitalize="off">`;
    const act=active();
    for(const s of PG){const rs=rows.filter(r=>pgOf(r)===s&&r.active);
      h+=`<h2 data-sec="${s}"><span class="hi">${svg(SECI[s]||"box",22)}</span>${s}</h2>`;
      if(!rs.length)h+=`<p class="mute" data-sec="${s}">No active rows in this section.</p>`;
      for(const r of rs){const d=drafts[r.id]||{};
        const f=(k,l,fn)=>`<div class="k-${k}"><label>${esc(l)}</label><div class="fld"><input inputmode="decimal" data-r="${r.id}" data-k="${k}" value="${esc(d[k]||"")}"><button class="plus" data-add="1" aria-label="Add amount">+</button></div>${fn||""}</div>`;
        h+=`<div class="card" data-sec="${s}" data-nm="${esc(r.name.toLowerCase())}"><div class="rh"><span class="num">${String(act.indexOf(r)+1).padStart(2,"0")}</span><span>${esc(r.name).replace(/\+/g,"+<wbr>")}</span></div><div class="row3" data-n="${["b","i","n"].filter(k=>has(r,k)).length||1}" style="grid-template-columns:repeat(${["b","i","n"].filter(k=>has(r,k)).length||1},1fr)">
        ${!has(r,"b")?"":f("b",L(r,"b")+(r.mult===1?"":" (×"+r.mult+")"),r.mult===1?"":`<div class="calc" data-calc="${r.id}">${calcText(r,d.b)}</div>`)}${has(r,"i")?f("i",L(r,"i")):""}${has(r,"n")?f("n",L(r,"n")):""}</div></div>`}
    }
    h+=`<p class="mute" id="nores" style="display:none">No rows match your search.</p><div class="bar orbsp"></div>`;
  }else if(view==="history"){
    h=`<button class="back" data-go="home">← Home</button><div class="eye">Your history</div><h1>Previous counts</h1><p class="mute">Every saved session, right here on this device.</p>`;
    h+=sessions.length?`<div class="list">${sessions.map(s=>`<div class="swr" data-sid="${s.id}"><button class="swd" data-delsess="${s.id}" aria-label="Delete">Delete</button><div class="it swi" data-open="${s.id}" style="cursor:pointer"><div><div>${nice(s.date)}</div><div class="mute" style="font-weight:400;font-size:14px">${s.entries.length} rows</div></div><span class="chk" style="color:var(--mute)">→</span></div></div>`).join("")}</div>`
    :`<div class="empty"><div class="b">☑</div><h3>No counts saved yet</h3><p class="mute">When you finish a stock count, it will appear here for you to revisit.</p><button class="pri" style="width:auto;padding:0 28px" data-go="enter">+ Start a count</button></div>`;
  }else if(view==="detail"){
    const s=sessions.find(x=>x.id===arg);
    if(!s){return go("history")}
    h=`<button class="back" data-go="history">← Previous counts</button><div class="eye">Saved count</div><h1>${nice(s.date)}</h1><div class="acts"><button class="pri" data-edit="${s.id}">✎ Edit</button><button class="del" data-delsess="${s.id}">🗑 Delete</button></div>`;
    let n=0;const T=(l,v,a)=>`<div class="tile"><span>${esc(l)}</span><b>${a||""}${fmtN(v)}</b></div>`;
    for(const sec of SECTIONS){const es=s.entries.filter(e=>e.section===sec);if(!es.length)continue;
      h+=`<h2>${sec}</h2><div class="card" style="padding:0;overflow:hidden">${es.map(e=>{n++;return `<div class="dr"><div class="rh"><span class="num">${String(n).padStart(2,"0")}</span>${esc(e.name)}${e.tr?`<button class="adds" data-trail="1" aria-expanded="false">Adds</button>`:""}</div><div class="tiles" style="grid-template-columns:repeat(${3-eOff(e).length||1},1fr)">${eOff(e).includes("b")?"":T(EL(e,"b")+(e.mult===1?"":" (×"+e.mult+")"),e.boxes==null?null:e.boxes*e.mult,AP(e,"b"))}${eOff(e).includes("i")?"":T(EL(e,"i"),e.inners,AP(e,"i"))}${eOff(e).includes("n")?"":T(EL(e,"n"),e.individuals,AP(e,"n"))}</div>${e.tr?trailBox(e):""}</div>`}).join("")}</div>`}
  }else if(view==="settings"){
    h=`<button class="back" data-go="home">← Home</button><div class="eye">Make it yours</div><h1>Settings</h1>${lockCard()}${syCard()}${themeCard()}`;
  }else if(view==="manage"){
    h=`<button class="back" data-go="home">← Home</button><div class="eye">Your count, your way</div><h1>Manage rows</h1>
    <input type="text" id="mq" class="srch" placeholder="Search rows…" value="${esc(mq)}" autocomplete="off" autocapitalize="off">
    <div class="card"><label class="mute" style="font-weight:600">Section</label><select id="ms">${SECTIONS.map(s=>`<option${s===mSection?" selected":""}>${s}</option>`).join("")}</select>
    <label class="mute" style="font-weight:600">Row name</label><input type="text" id="mn" placeholder="For example, Seasonal pies">
    <button class="pri" data-act="addrow">+ Add row</button></div>`;
    for(const s of SECTIONS){const rs=rows.filter(r=>r.section===s);
      h+=`<div class="sec" data-secc="${s}"><h2><span class="hi">${svg(SECI[s]||"box",22)}</span>${s}</h2><span class="mute">${rs.filter(r=>r.active).length} active · ${rs.length} total</span></div>`;
      h+=rs.length?`<div class="list" data-sec="${s}">${rs.map((r,i)=>`<div class="it mr" data-toggle="${r.id}" style="cursor:pointer"><div class="line"><span class="grip" data-grip="${r.id}" aria-label="Drag to reorder">⠿</span><span class="mono">${String(i+1).padStart(2,"0")}</span><span class="${r.active?"":"off"}">${esc(r.name)}</span><span class="chk" style="${r.active?"":"visibility:hidden"}">✓</span><button data-cfg="${r.id}" aria-label="Fields" style="font-size:18px">⚙</button><button data-del="${r.id}" aria-label="Delete" style="font-size:18px">🗑</button></div>${openRow===r.id?`<div class="flds">${[["b","Boxes"],["i","Inners"],["n","Individuals"]].map(([k,l])=>`<div class="fe"><button class="chip ${has(r,k)?"on":""}" data-fld="${r.id}|${k}">${has(r,k)?"✓ On":"Off"}</button><input type="text" class="fl" data-lbl="${r.id}|${k}" value="${esc(L(r,k))}" placeholder="${l}" maxlength="24"></div>`).join("")}<div class="fe"><span class="mute" style="flex:none;min-width:64px;font-size:14px">Units per box</span><input type="text" inputmode="decimal" class="fl" data-mult="${r.id}" value="${r.mult||1}" placeholder="1"></div><div class="mute" style="font-size:12px">Boxes are multiplied by this. Use 1 to turn multiplying off.</div></div>`:""}</div>`).join("")}</div>`:`<p class="mute">No rows yet.</p>`;
    }
  }
  app.innerHTML=h;
  parallax();
  if(view!==lastView){lastView=view;app.classList.remove("anim");void app.offsetWidth;app.classList.add("anim");clearTimeout(window._animT);window._animT=setTimeout(()=>app.classList.remove("anim"),1100)}
  holoInit();
  if(view==="enter"){updTabs();applyFilter();saveDraft();moveInd()}
  if(view==="manage"&&mq)applyMq();
  orbTargets(false);if(view==="enter")orbUpd();
}

document.addEventListener("click",async e=>{
  if(Date.now()-swSupp<350){e.preventDefault();e.stopPropagation();return}
  { const op=e.target.closest(".swi.open"); if(op&&!e.target.closest(".swd")){closeSwipes();return} }
  if(e.target.closest("[data-grip],[data-lbl]")||(e.target.closest(".flds")&&!e.target.closest("[data-fld]")))return;
  const t=e.target.closest("[data-go],[data-act],[data-add],[data-open],[data-toggle],[data-del],[data-delsess],[data-edit],[data-mv],[data-cfg],[data-fld],[data-tilde],[data-tab],[data-done],[data-acc],[data-look],[data-fnt],[data-mode],[data-mot],[data-tod],[data-gfx],[data-holo],[data-trail],[data-sy]");
  if(!t)return;
  const D=t.dataset;
  if(D.trail){const dr=t.closest(".dr");if(dr){const o=dr.classList.toggle("tropen");t.setAttribute("aria-expanded",o?"true":"false");t.textContent=o?"Hide":"Adds"}return}
  if(D.sy){
    if(D.sy==="connect"){const u=(document.getElementById("syurl")||{}).value||"",k=(document.getElementById("sykey")||{}).value||"";
      if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u.trim())||!k.trim()){SY.err="Enter the Web app URL (ending in /exec) and your key.";syUI();return}
      Object.assign(SY,{url:u.trim(),key:k.trim(),joined:false,err:"",since:0,pu:0,rpu:0,sh:{},tomb:{}});syStore();
      await syncNow(true);if(!SY.joined){const e=SY.err;SY.url="";SY.key="";SY.err=e;syStore()}render();return}
